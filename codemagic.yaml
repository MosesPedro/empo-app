workflows:
  empo-unsigned-ipa:
    name: Build Unsigned Empo IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Check repo build scripts and iOS project structure
        script: |
          echo "=== scripts/ ==="
          ls -la scripts/ || true
          echo "=== cores/ ==="
          ls -la cores/ || true
          echo "=== ios/ ==="
          ls -la ios/ || true
      - name: Install required CLI tools and run setup
        script: |
          brew install oven-sh/bun/bun swift-format swiftlint clang-format shfmt shellcheck
          chmod +x setup.sh
          ./setup.sh
      - name: Download cores if setup script exists in scripts/
        script: |
          # Run any dependency/core fetch script if present
          for s in scripts/*fetch* scripts/*setup* scripts/*deps* scripts/*cores* scripts/*download*; do
            if [ -f "$s" ]; then
              echo "Found script: $s"
              cat "$s"
            fi
          done
      - name: Build unsigned xcarchive
        script: |
          cd ios
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project "$PROJECT" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
      - name: Package .app into valid IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Empo.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r Empo-unsigned.ipa Payload
    artifacts:
      - build/Empo-unsigned.ipa
