workflows:
  empo-unsigned-ipa:
    name: Build Unsigned Empo IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh | bash
          echo 'export BUN_INSTALL="$HOME/.bun"' >> ~/.zshenv
          echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> ~/.zshenv
      - name: Run setup script for cores and dependencies
        script: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          chmod +x setup.sh
          ./setup.sh
      - name: Build unsigned xcarchive
        script: |
          cd ios
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project "$PROJECT" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
      - name: Package .app into valid IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Empo.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r Empo-unsigned.ipa Payload
    artifacts:
      - build/Empo-unsigned.ipa
