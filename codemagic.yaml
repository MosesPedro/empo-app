workflows:
  empo-unsigned-ipa:
    name: Build Unsigned Empo IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Install XcodeGen and inspect repo files
        script: |
          brew install xcodegen
          echo "=== scripts/ ==="
          ls -la scripts/ || true
          echo "=== ios/ ==="
          ls -la ios/ || true
      - name: Fetch cores and generate Xcode project
        script: |
          # Run any setup, fetch, or project generation scripts if present
          for script_file in scripts/*.sh ios/*.sh; do
            if [ -f "$script_file" ]; then
              echo "Found script: $script_file"
            fi
          done

          # Generate .xcodeproj if project.yml exists in root or ios/
          if [ -f "project.yml" ]; then
            xcodegen generate
          elif [ -f "ios/project.yml" ]; then
            cd ios && xcodegen generate && cd ..
          fi

          # Run core/dependency download scripts if present
          for s in scripts/*fetch*.sh scripts/*deps*.sh scripts/*cores*.sh scripts/*download*.sh scripts/*gen*.sh; do
            if [ -f "$s" ]; then
              echo "Running $s..."
              chmod +x "$s"
              ./"$s"
            fi
          done
      - name: Build unsigned xcarchive
        script: |
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "Building workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -n "$PROJECT" ]; then
            echo "Building project: $PROJECT"
            xcodebuild -project "$PROJECT" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "ERROR: Could not find .xcworkspace or .xcodeproj anywhere in repository."
            find . -maxdepth 3
            exit 1
          fi
      - name: Package .app into valid IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Empo.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r Empo-unsigned.ipa Payload
    artifacts:
      - build/Empo-unsigned.ipa
