workflows:
  empo-unsigned-ipa:
    name: Build Unsigned Empo IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Inspect repo structure and fetch cores if needed
        script: |
          echo "=== Checking scripts/ and ios/ ==="
          ls -la scripts/ || true
          ls -la ios/ || true

          # Automatically run any core/dependency fetch script if present
          for script_file in scripts/*fetch*.sh scripts/*deps*.sh scripts/*cores*.sh scripts/*download*.sh scripts/*bootstrap*.sh ios/*setup*.sh ios/*deps*.sh; do
            if [ -f "$script_file" ]; then
              echo "Running dependency script: $script_file"
              chmod +x "$script_file"
              ./"$script_file"
            fi
          done
      - name: Build unsigned xcarchive
        script: |
          cd ios
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "Building workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "Building project: $PROJECT"
            xcodebuild -project "$PROJECT" \
              -scheme "Empo" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
      - name: Package .app into valid IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Empo.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r Empo-unsigned.ipa Payload
    artifacts:
      - build/Empo-unsigned.ipa
