workflows:
  empo-unsigned-ipa:
    name: Build Unsigned Empo IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Inspect official GitHub prepare action & release workflow
        script: |
          echo "=== prepare-xcode-project ==="
          cat .github/actions/prepare-xcode-project/action.yml || ls -la .github/actions/prepare-xcode-project/
          echo "=== release.yml ==="
          cat .github/workflows/release.yml
      - name: Install tools and run official project prep
        script: |
          brew install xcodegen oven-sh/bun/bun
          # Fetch ANGLE and cores if scripts are executable
          [ -f tools/fetch-angle.sh ] && bash tools/fetch-angle.sh || true
          [ -f cores/cores.sh ] && bash cores/cores.sh || true
          # Generate Empo.xcodeproj inside ios/Empo/
          cd ios/Empo
          xcodegen generate
      - name: Build unsigned xcarchive
        script: |
          cd ios/Empo
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Building project: $PROJECT"
          xcodebuild -project "$PROJECT" \
            -scheme "Empo" \
            -configuration Release \
            -sdk iphoneos \
            -xcconfig "Sideload.xcconfig" \
            -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .app into valid IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Empo.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r Empo-unsigned.ipa Payload
    artifacts:
      - build/Empo-unsigned.ipa
