workflows:
  empo-unsigned-ipa:
    name: Build Unsigned Empo IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
    scripts:
      - name: Check Xcode versions and official release workflow
        script: |
          echo "=== Installed Xcode versions ==="
          ls -d /Applications/Xcode*.app || true
          echo "=== Official release.yml ==="
          cat .github/workflows/release.yml || true

          # Select the newest Xcode installed on the machine
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting newest Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install build tools and prepare project
        script: |
          brew install xcodegen oven-sh/bun/bun gh

          # Hydrate ANGLE and prebuilt game cores
          bash tools/fetch-angle.sh
          bash cores/cores.sh fetch || bash cores/cores.sh || true

          # Create Signing.xcconfig from Sideload.xcconfig
          cp ios/Empo/Sideload.xcconfig ios/Empo/Signing.xcconfig

          # Generate Empo.xcodeproj
          cd ios/Empo
          xcodegen generate
      - name: Build unsigned xcarchive
        script: |
          cd ios/Empo
          set -o pipefail
          xcodebuild -project "Empo.xcodeproj" \
            -scheme "Empo" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Empo.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log" | grep -E "error:|fatal error:|ARCHIVE SUCCEEDED|ARCHIVE FAILED"
      - name: Package .app into valid IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Empo.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r Empo-unsigned.ipa Payload
    artifacts:
      - build/Empo-unsigned.ipa
      - build/xcodebuild.log
